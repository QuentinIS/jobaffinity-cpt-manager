name: Lint

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  plugin-check:
    name: WordPress Plugin Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Check what actually ships, not the repository root: .distignore keeps
      # the development files out of the zip, and Plugin Check rightly rejects
      # them when they are present.
      - name: Build the distribution tree
        run: |
          mkdir -p build/jobaffinity-cpt-manager
          rsync -a --exclude-from=.distignore ./ build/jobaffinity-cpt-manager/
          find build -type f | sort

      # Same ruleset the wordpress.org review team's automated pass uses:
      # readme.txt parsing, escaping, sanitisation, i18n, file headers.
      - uses: wordpress/plugin-check-action@v1
        with:
          build-dir: './build/jobaffinity-cpt-manager'

  phpcs:
    name: WordPress Coding Standards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          coverage: none
          tools: composer, cs2pr

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run PHPCS
        run: vendor/bin/phpcs -q --report=checkstyle . | cs2pr
